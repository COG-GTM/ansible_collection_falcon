name: 'Setup Python and Ansible Dependencies'
description: 'Set up Python with caching and install Ansible dependencies'
inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.11'
  requirements-file:
    description: 'Path to Python requirements file'
    required: false
    default: '.devcontainer/requirements.txt'
  install-pywinrm:
    description: 'Install pywinrm for Windows testing'
    required: false
    default: 'false'
  additional-dependencies:
    description: 'Additional pip packages to install (space-separated)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'
        cache-dependency-path: ${{ inputs.requirements-file }}

    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt install apt-transport-https ca-certificates curl software-properties-common libssl-dev

    - name: Install Python dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r ${{ inputs.requirements-file }}
        if [ "${{ inputs.install-pywinrm }}" = "true" ]; then
          pip install pywinrm
        fi
        if [ -n "${{ inputs.additional-dependencies }}" ]; then
          pip install ${{ inputs.additional-dependencies }}
        fi
