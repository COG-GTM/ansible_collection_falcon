name: Reusable Collection Release Workflow

on:
  workflow_call:
    inputs:
      python_version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.8'
      collection_namespace:
        description: 'Collection namespace (e.g., crowdstrike)'
        required: true
        type: string
      collection_name:
        description: 'Collection name (e.g., falcon)'
        required: true
        type: string
      galaxy_server_url:
        description: 'Ansible Galaxy server URL'
        required: false
        type: string
        default: 'https://galaxy.ansible.com'
      publish_to_galaxy:
        description: 'Publish to Ansible Galaxy'
        required: false
        type: boolean
        default: true
      publish_to_github:
        description: 'Upload artifacts to GitHub release'
        required: false
        type: boolean
        default: true
      publish_to_automation_hub:
        description: 'Publish to Red Hat Automation Hub'
        required: false
        type: boolean
        default: false
      automation_hub_url:
        description: 'Automation Hub content URL'
        required: false
        type: string
        default: ''
      automation_hub_auth_url:
        description: 'Automation Hub authentication URL'
        required: false
        type: string
        default: 'https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token'
    secrets:
      GALAXY_API_KEY:
        description: 'Ansible Galaxy API key'
        required: false
      AUTOMATION_HUB_TOKEN:
        description: 'Red Hat Automation Hub token'
        required: false
      GITHUB_TOKEN:
        description: 'GitHub token for release uploads'
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install pip and ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Create release artifacts
        run: ansible-galaxy collection build

      - name: Publish to Ansible Galaxy
        if: ${{ inputs.publish_to_galaxy }}
        run: |
          ansible-galaxy collection publish *.tar.gz --api-key ${{ secrets.GALAXY_API_KEY }}

      - name: Upload to GitHub Release
        if: ${{ inputs.publish_to_github }}
        run: |
          gh release upload $TAG ./${{ inputs.collection_namespace }}-${{ inputs.collection_name }}*.tar.gz
        env:
          TAG: ${{ github.event.release.tag_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Ansible Automation Hub
        if: ${{ inputs.publish_to_automation_hub }}
        run: |
          cat << EOF > ansible.cfg
          [galaxy]
          server_list = automation_hub

          [galaxy_server.automation_hub]
          url=${{ inputs.automation_hub_url }}
          auth_url=${{ inputs.automation_hub_auth_url }}
          token=$AUTOMATION_HUB_TOKEN
          EOF
          ansible-galaxy collection publish ./${{ inputs.collection_namespace }}-${{ inputs.collection_name }}*.tar.gz
        env:
          AUTOMATION_HUB_TOKEN: ${{ secrets.AUTOMATION_HUB_TOKEN }}
