name: Reusable Molecule Integration Test Workflow

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: 'Git ref to checkout (branch, tag, or commit SHA)'
        required: false
        type: string
        default: ''
      python_version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.11'
      requirements_file:
        description: 'Path to Python requirements file'
        required: false
        type: string
        default: '.devcontainer/requirements.txt'
      test_matrix:
        description: 'JSON string containing the test matrix configuration'
        required: true
        type: string
      molecule_scenarios:
        description: 'JSON array of molecule scenario names to test'
        required: true
        type: string
      aws_region:
        description: 'AWS region for EC2 instances'
        required: false
        type: string
        default: 'us-west-2'
      install_pywinrm:
        description: 'Install pywinrm for Windows testing'
        required: false
        type: boolean
        default: false
      additional_dependencies:
        description: 'Additional pip packages to install (space-separated)'
        required: false
        type: string
        default: ''
      build_timeout_minutes:
        description: 'Timeout for collection build/install'
        required: false
        type: number
        default: 2
      test_timeout_minutes:
        description: 'Timeout for molecule test execution'
        required: false
        type: number
        default: 30
      cleanup_timeout_minutes:
        description: 'Timeout for instance cleanup'
        required: false
        type: number
        default: 10
      max_retry_attempts:
        description: 'Maximum retry attempts for operations'
        required: false
        type: number
        default: 3
    secrets:
      AWS_OIDC_ROLE:
        description: 'AWS IAM role ARN for OIDC authentication'
        required: true
      MOLECULE_VPC_SUBNET_ID:
        description: 'VPC subnet ID for EC2 instances'
        required: true
      COLLECTION_API_CLIENT_ID:
        description: 'API client ID for collection-specific operations'
        required: false
      COLLECTION_API_CLIENT_SECRET:
        description: 'API client secret for collection-specific operations'
        required: false
      COLLECTION_CID:
        description: 'Customer/Client ID for collection-specific operations'
        required: false
      COLLECTION_PROV_TOKEN:
        description: 'Provisioning token for collection-specific operations'
        required: false

jobs:
  molecule:
    name: ${{ matrix.molecule.distro }}-${{ matrix.collection_role }}
    runs-on: ubuntu-latest
    env:
      PY_COLORS: 1
      ANSIBLE_FORCE_COLOR: 1
      COLLECTION_API_CLIENT_ID: ${{ secrets.COLLECTION_API_CLIENT_ID }}
      COLLECTION_API_CLIENT_SECRET: ${{ secrets.COLLECTION_API_CLIENT_SECRET }}
      COLLECTION_CID: ${{ secrets.COLLECTION_CID }}
      COLLECTION_PROV_TOKEN: ${{ secrets.COLLECTION_PROV_TOKEN }}
      AWS_REGION: ${{ inputs.aws_region }}
      MOLECULE_VPC_SUBNET_ID: ${{ secrets.MOLECULE_VPC_SUBNET_ID }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.test_matrix) }}
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          role-session-name: github-actions-molecule-ansible
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: 'pip'
          cache-dependency-path: ${{ inputs.requirements_file }}

      - name: Install dependencies
        run: |
          sudo apt install apt-transport-https ca-certificates curl software-properties-common libssl-dev
          python -m pip install --upgrade pip
          pip install -r ${{ inputs.requirements_file }}
          if [ "${{ inputs.install_pywinrm }}" = "true" ]; then
            pip install pywinrm
          fi
          if [ -n "${{ inputs.additional_dependencies }}" ]; then
            pip install ${{ inputs.additional_dependencies }}
          fi

      - name: Build/Install the collection
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: ${{ inputs.build_timeout_minutes }}
          max_attempts: ${{ inputs.max_retry_attempts }}
          retry_on: error
          command: |
            collection_file=$( basename $(ansible-galaxy collection build -f | awk -F" " '{print $NF}'))
            ansible-galaxy collection install $collection_file

      - name: Run role tests
        id: molecule-role-test
        uses: nick-fields/retry@v3
        env:
          MOLECULE_INSTANCE_NAME: ${{ matrix.molecule.distro }}-${{ matrix.collection_role }}
          MOLECULE_IMAGE_OWNER: ${{ matrix.molecule.image_owner }}
          MOLECULE_IMAGE_ARCH: ${{ matrix.molecule.image_arch }}
          MOLECULE_IMAGE_NAME: '${{ matrix.molecule.image_name }}'
          MOLECULE_INSTANCE_TYPE: ${{ matrix.molecule.instance_type }}
          MOLECULE_REGION: ${{ env.AWS_REGION}}
        with:
          timeout_minutes: ${{ inputs.test_timeout_minutes }}
          max_attempts: ${{ inputs.max_retry_attempts }}
          retry_on: error
          command: >-
            molecule --version &&
            ansible --version &&
            molecule test --destroy never -s ${{ matrix.collection_role }} -- -v
        continue-on-error: true

      - name: Ensure instances are destroyed
        uses: nick-fields/retry@v3
        env:
          MOLECULE_INSTANCE_NAME: ${{ matrix.molecule.distro }}-${{ matrix.collection_role }}
          MOLECULE_IMAGE_OWNER: ${{ matrix.molecule.image_owner }}
          MOLECULE_IMAGE_ARCH: ${{ matrix.molecule.image_arch }}
          MOLECULE_IMAGE_NAME: '${{ matrix.molecule.image_name }}'
          MOLECULE_INSTANCE_TYPE: ${{ matrix.molecule.instance_type }}
          MOLECULE_REGION: ${{ env.AWS_REGION}}
        with:
          timeout_minutes: ${{ inputs.cleanup_timeout_minutes }}
          max_attempts: ${{ inputs.max_retry_attempts }}
          retry_on: error
          command: >-
            molecule --version &&
            ansible --version &&
            molecule destroy -s ${{ matrix.collection_role }}

      - name: Assert molecule tests passed
        uses: nick-fields/assert-action@v2
        with:
          expected: success
          actual: ${{ steps.molecule-role-test.outcome }}
