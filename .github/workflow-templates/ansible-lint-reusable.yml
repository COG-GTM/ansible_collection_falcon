name: Reusable Ansible Lint Workflow

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: 'Git ref to checkout (branch, tag, or commit SHA)'
        required: false
        type: string
        default: ''
      ansible_lint_version:
        description: 'Version of ansible-lint action to use'
        required: false
        type: string
        default: 'v25.8.2'
      working_directory:
        description: 'Working directory for ansible-lint'
        required: false
        type: string
        default: '.'

jobs:
  ansible_lint:
    name: Verify Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Run Ansible Lint
        uses: ansible/ansible-lint@${{ inputs.ansible_lint_version }}
        with:
          working_directory: ${{ inputs.working_directory }}
